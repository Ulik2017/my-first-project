<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sales App - AdminLTE</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <ul class="navbar-nav"><li class="nav-item"><span class="nav-link font-weight-bold">Sales Application</span></li></ul>
    <ul class="navbar-nav ml-auto"><li class="nav-item"><button id="logoutBtn" class="btn btn-sm btn-danger">Logout</button></li></ul>
  </nav>

  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="#" class="brand-link"><span class="brand-text font-weight-light">AdminLTE Sales</span></a>
    <div class="sidebar">
      <div class="user-panel mt-3 pb-3 mb-3 d-flex"><div class="info"><span id="sessionInfo" class="d-block text-white"></span></div></div>
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column">
          <li class="nav-item"><a href="#" class="nav-link tab-link active" data-tab="sales"><i class="nav-icon fas fa-users"></i><p>Sales Master</p></a></li>
          <li class="nav-item"><a href="#" class="nav-link tab-link" data-tab="customer"><i class="nav-icon fas fa-building"></i><p>Customer Master</p></a></li>
          <li class="nav-item"><a href="#" class="nav-link tab-link" data-tab="quotation"><i class="nav-icon fas fa-file-invoice"></i><p>Detail Quotation</p></a></li>
          <li class="nav-item"><a href="#" class="nav-link tab-link" data-tab="board"><i class="nav-icon fas fa-columns"></i><p>Progress Board</p></a></li>
        </ul>
      </nav>
    </div>
  </aside>

  <div class="content-wrapper">
    <section id="loginView" class="content p-3">
      <div class="card card-primary mx-auto" style="max-width: 520px;">
        <div class="card-header"><h3 class="card-title">Login</h3></div>
        <div class="card-body">
          <form id="loginForm">
            <div class="form-group"><label>Username</label><input id="loginUsername" class="form-control" required></div>
            <div class="form-group"><label>Password</label><input id="loginPassword" class="form-control" type="password" required></div>
            <button class="btn btn-primary btn-block" type="submit">Masuk</button>
          </form>
          <div id="adminModeChooser" class="mt-3 d-none">
            <p class="mb-2">Administrator: pilih mode</p>
            <button data-mode="project" class="btn btn-info mode-btn">Project</button>
            <button data-mode="regular" class="btn btn-success mode-btn">Regular</button>
          </div>
        </div>
      </div>
    </section>

    <section id="appView" class="content p-3 d-none">
      <div id="tab-sales" class="tab-panel card"><div class="card-header"><h3 class="card-title">Sales Master</h3></div><div class="card-body">
        <form id="salesForm" class="stack-form">
          <input type="hidden" id="salesId" />
          <div class="form-group"><label>Nama</label><input id="salesName" class="form-control" required /></div>
          <div class="form-group"><label>Email</label><input id="salesEmail" type="email" class="form-control" required /></div>
          <div class="form-group"><label>HP</label><input id="salesPhone" class="form-control" required /></div>
          <div class="form-group"><label>Kategori</label><select id="salesCategory" class="form-control"><option value="regular">Regular</option><option value="project">Project</option><option value="administrator">Administrator</option></select></div>
          <div class="form-group"><label>Username Login</label><input id="salesUsername" class="form-control" required /></div>
          <div class="form-group"><label>Password Login</label><input id="salesPassword" type="password" class="form-control" placeholder="Isi password login sales" required /></div>
          <div class="form-actions"><button class="btn btn-primary" type="submit">Simpan</button><button class="btn btn-secondary" id="salesReset" type="button">Reset</button></div>
        </form>
        <div class="table-responsive"><table id="salesTable" class="table table-bordered table-striped"><thead><tr><th>Nama</th><th>Email</th><th>HP</th><th>Kategori</th><th>Username</th><th>Password</th><th>Aksi</th></tr></thead><tbody></tbody></table></div>
      </div></div>

      <div id="tab-customer" class="tab-panel card d-none"><div class="card-header"><h3 class="card-title">Customer Master</h3></div><div class="card-body">
        <form id="customerForm" class="stack-form customer-form">
          <input type="hidden" id="customerId" />
          <div class="form-group"><label>Name</label><input id="customerName" class="form-control" required /></div>
          <div class="form-group"><label>PIC</label><input id="customerPic" class="form-control" required /></div>
          <div class="form-group"><label>Country</label><input id="customerCountry" class="form-control" list="countryList" placeholder="Cari negara..." required /><datalist id="countryList"></datalist></div>
          <div class="form-group"><label>State (Provinsi Indonesia)</label><select id="customerState" class="form-control" required></select></div>

          <div class="form-group"><label>Email</label><input id="customerEmail" type="email" class="form-control" required /></div>
          <div class="form-group"><label>Telp</label><input id="customerPhone" class="form-control" required /></div>
          <div class="form-group"><label>Website</label><input id="customerWebsite" type="url" class="form-control" required /></div>
          <div class="form-group"><label>Alamat</label><textarea id="customerAddress" class="form-control" rows="2" required></textarea></div>

          <div class="form-actions">
              <button class="btn btn-primary" type="submit">Simpan</button>
              <button class="btn btn-secondary" id="customerReset" type="button">Reset</button>
            </div>
        </form>
        <div class="table-responsive"><table id="customerTable" class="table table-bordered table-striped"><thead><tr><th>Name</th><th>PIC</th><th>Country</th><th>State</th><th>Alamat</th><th>Email</th><th>Telp</th><th>Website</th><th>Aksi</th></tr></thead><tbody></tbody></table></div>
      </div></div>

      <div id="tab-quotation" class="tab-panel card d-none"><div class="card-header"><h3 class="card-title">Detail Quotation</h3></div><div class="card-body">
        <form id="quotationForm" class="stack-form">
          <input type="hidden" id="quotationId" />
          <div class="form-group"><label>Sales</label><select id="quotationSales" class="form-control" required></select></div>
          <div class="form-group"><label>Customer</label><select id="quotationCustomer" class="form-control" required></select></div>
          <div class="form-group"><label>Total Kebutuhan</label><input id="quotationNeed" class="form-control" required /></div>
          <div class="form-group"><label>Total Price</label><input id="quotationPrice" type="number" class="form-control" required /></div>
          <div class="form-group"><label>Remark</label><input id="quotationRemark" class="form-control" /></div>
          <div class="form-group"><label>Deadline</label><input id="quotationDeadline" type="date" class="form-control" required /></div>
          <div class="form-group"><label>Progress</label><select id="quotationProgress" class="form-control" required></select></div>
          <div class="form-actions"><button class="btn btn-primary" type="submit">Simpan</button> <button class="btn btn-secondary" id="quotationReset" type="button">Reset</button></div>
        </form>
      </div></div>

      <div id="tab-board" class="tab-panel d-none">
        <div class="trello-board" id="kanban"></div>
      </div>
    </section>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
<script src="app.js"></script>
</body>
</html>
